<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Lander</title>
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #05060d; color: #e6e9f2; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
	/* --pad is the body's vertical padding, --touch the height taken by the touch buttons when shown. */
	:root { --pad: 12px; --touch: 0px; }
	@media (pointer: coarse) { :root { --touch: 76px; } }
	body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; height: 100dvh; box-sizing: border-box; padding: var(--pad) 16px; }
	main { width: min(100%, calc((100vh - 2 * var(--pad) - var(--touch)) * 1000 / 650)); width: min(100%, calc((100dvh - 2 * var(--pad) - var(--touch)) * 1000 / 650)); }
	canvas { display: block; width: 100%; height: auto; aspect-ratio: 1000 / 650; border-radius: 10px; background: #05060d; touch-action: none; }
	#touch { display: flex; gap: 10px; margin-top: 12px; }
	#touch[hidden] { display: none; }
	#touch button { flex: 1; height: 64px; font-size: 26px; color: #fff; background: #ffffff1c; border: 1px solid #ffffff40; border-radius: 12px; touch-action: none; user-select: none; -webkit-user-select: none; }
	#touch button:active { background: #ffffff38; }
</style>
</head>
<body>
<main>
	<canvas id="game" width="1000" height="650" aria-label="Lunar lander game"></canvas>
	<div id="touch" hidden>
		<button data-key="left" aria-label="Rotate left">&#9664;</button>
		<button data-key="thrust" aria-label="Thrust">&#9650;</button>
		<button data-key="right" aria-label="Rotate right">&#9654;</button>
	</div>
</main>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
